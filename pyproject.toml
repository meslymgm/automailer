[project]
name = "stay-updated-current"
version = "0.1.0"
description = "An automated mailing system"
authors = [
    {name = "Mesly",email = "meslymathews@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14.2,<4.0"
dependencies = [
    "feedparser (>=6.0.14,<7.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "torch (>=2.14.0,<3.0.0)",
    "torchvision (>=0.29.0,<0.30.0)",
    "sentence-transformers (>=6.1.0,<7.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "sns (>=0.1,<0.2)",
    "seaborn (>=0.13.2,<0.14.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "openai (>=3.19.2,<4.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "asyncio (>=4.0.0,<5.0.0)",
    "google-api-python-client (>=2.201.0,<3.0.0)",
    "google-auth (>=2.59.1,<3.0.0)",
    "google-auth-oauthlib (>=1.5.0,<2.0.0)",
    "tenacity (>=9.2.1,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "ruff (>=0.16.10,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "pyright (>=1.1.414,<2.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)",
    "bandit (>=1.9.4,<2.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I","UP","SIM", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
include = ["src", "tests"]

extraPaths = ["src"]